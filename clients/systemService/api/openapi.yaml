      - application/xml
  /api/v2/SystemService/BusinessDomains:
    get:
      description: Retrieve all registered business domains across every tenant (global
        administrators only).
      operationId: GetSystemBusinessDomains
      parameters:
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessDomainDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/BusinessDomainDtoCollectionQueryParameters'
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDomainDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/BusinessDomainDtoListEnvelope'
          description: OK
      summary: Retrieve all business domains in the system
      tags:
      - BusinessDomains
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/BusinessDomains/Count:
    get:
      description: Get the count of all registered business domains across every tenant.
