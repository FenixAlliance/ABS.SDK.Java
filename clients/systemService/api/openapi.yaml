openapi: 3.0.4
info:
  contact:
    email: support@fenix-alliance.com
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  termsOfService: https://absuite.net/eula
  title: SystemService
  version: 2.0.0.0
servers:
- description: Alliance Business Suite API
  url: "{server}"
  variables:
    server:
      default: https://absuite.net
      description: ABS instance base URL
      enum:
      - https://absuite.net
      - https://test.absuite.net
      - https://dev.absuite.net
      - https://localhost:44388
tags:
- name: Antiforgery
- name: ApplicationPrincipals
- name: BusinessDomains
- name: Carts
- name: ContactOptions
- name: Emails
- name: FenixAlliance.ABS.Web
- name: Inbox
- name: IPLookups
- name: Licensing
- name: Migrations
- name: Modules
- name: Options
- name: Outbox
- name: Overview
- name: Portals
- name: TenantOptions
- name: Tenants
- name: UserOptions
- name: Users
paths:
  /api/v2/SystemService/Antiforgery/GetAndStoreTokens:
    get:
      description: Generates antiforgery tokens and stores them in the current HTTP
        context.
      operationId: GetAndStoreTokens
      parameters:
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: Get and store antiforgery tokens
      tags:
      - Antiforgery
      x-accepts:
      - application/json
  /api/v2/SystemService/Antiforgery/IsRequestValid:
    get:
      description: Validates whether the current HTTP request contains a valid antiforgery
        token.
      operationId: IsRequestValidAsync
      parameters:
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: Validate antiforgery request
      tags:
      - Antiforgery
      x-accepts:
      - application/json
  /api/v2/SystemService/ApplicationPrincipals:
    get:
      description: "Lists every non-human application principal enrollment across\
        \ ALL tenants (payload-safe fields only), including the platform-managed (system-locked)\
        \ connectors. Use OData to scope — e.g. $filter=SystemLocked eq true for the\
        \ platform connectors or TenantId eq '{guid}' for one tenant — and to page/order.\
        \ Global-administrator only."
      operationId: GetGlobalApplicationPrincipals
      parameters:
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalDtoCollectionQueryParameters'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalDtoIReadOnlyListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalDtoIReadOnlyListEnvelope'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
      summary: List application principals across all tenants
      tags:
      - ApplicationPrincipals
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/Count:
    get:
      description: Returns the count of application principal enrollments across ALL
        tenants under the same OData shaping as the list read (e.g. $filter=SystemLocked
        eq true). Global-administrator only.
      operationId: GetGlobalApplicationPrincipalsCount
      parameters:
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalDtoCollectionQueryParameters'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
      summary: Count application principals across all tenants
      tags:
      - ApplicationPrincipals
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/{principalId}:
    get:
      description: "Returns one application principal's detail by id: owning application,\
        \ an enrollment, the system-locked flag, lifecycle status, and that enrollment's\
        \ explicit least-privilege grants. Pass tenantId to select the enrollment\
        \ for a multi-tenant principal; when omitted the principal's first enrollment\
        \ is used. Global-administrator only."
      operationId: GetGlobalApplicationPrincipal
      parameters:
      - explode: false
        in: path
        name: principalId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: tenantId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalDetailDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalDetailDtoEnvelope'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
      summary: Get one application principal (any tenant)
      tags:
      - ApplicationPrincipals
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/Provision:
    post:
      description: "Idempotently provisions the application principal (and its own\
        \ least-privilege enrollment) for a governed business application. tenantId\
        \ selects the target tenant (defaults to the platform/root tenant). Unlike\
        \ the per-tenant lane, a system-locked platform application is provisionable\
        \ here. Global-administrator only."
      operationId: ProvisionGlobalApplicationPrincipal
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalProvisionRequestDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalProvisionRequestDto'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalProvisioningResultDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalProvisioningResultDtoEnvelope'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
      summary: "Provision an application principal (any tenant, incl. system-locked)"
      tags:
      - ApplicationPrincipals
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/PaymentsConnector:
    post:
      description: "Idempotently stands up the platform payments-connector identity\
        \ — its well-known business application, its application principal, and its\
        \ own least-privilege enrollment (payments_create/payments_update/journals_post).\
        \ tenantId selects the target tenant (defaults to the platform/root tenant).\
        \ The provisioned connector then appears in this global list and (for its\
        \ tenant) the per-tenant list. Global-administrator only."
      operationId: ProvisionPaymentsConnector
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalProvisioningResultDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ApplicationPrincipalProvisioningResultDtoEnvelope'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
      summary: Provision the platform payments-connector identity
      tags:
      - ApplicationPrincipals
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/{principalId}/Permissions:
    post:
      description: "Grants a single least-privilege permission to the application\
        \ principal's enrollment in the tenantId tenant (grants are per-tenant, so\
        \ tenantId is required). Owner/admin/wildcard/*_manage permissions are rejected\
        \ even for a global admin (least-privilege by construction). Global-administrator\
        \ only."
      operationId: GrantGlobalApplicationPrincipalPermission
      parameters:
      - explode: false
        in: path
        name: principalId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalPermissionRequestDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/ApplicationPrincipalPermissionRequestDto'
        required: true
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unprocessable Content
      summary: Grant a permission to an application principal (any tenant)
      tags:
      - ApplicationPrincipals
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/{principalId}/Permissions/{permission}:
    delete:
      description: Revokes a direct permission grant from the application principal's
        enrollment in the tenantId tenant (required). Idempotent. Global-administrator
        only.
      operationId: RevokeGlobalApplicationPrincipalPermission
      parameters:
      - explode: false
        in: path
        name: principalId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: permission
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
      summary: Revoke a permission from an application principal (any tenant)
      tags:
      - ApplicationPrincipals
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/{principalId}/Enable:
    post:
      description: Reinstates the application principal to the Active lifecycle state
        (applies to system-locked principals here). tenantId scopes the action to
        a tenant the principal is enrolled in (required). Global-administrator only.
      operationId: EnableGlobalApplicationPrincipal
      parameters:
      - explode: false
        in: path
        name: principalId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
      summary: Enable an application principal (global)
      tags:
      - ApplicationPrincipals
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/{principalId}/Suspend:
    post:
      description: Temporarily suspends the application principal; its identity is
        retained but it cannot act until reinstated (applies to system-locked principals
        here). tenantId scopes the action to a tenant the principal is enrolled in
        (required). Global-administrator only.
      operationId: SuspendGlobalApplicationPrincipal
      parameters:
      - explode: false
        in: path
        name: principalId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
      summary: Suspend an application principal (global)
      tags:
      - ApplicationPrincipals
      x-accepts:
      - application/json
      - application/xml
  /api/v2/SystemService/ApplicationPrincipals/{principalId}/Disable:
    post:
      description: Disables the application principal; dependent unattended execution
        fails closed (applies to system-locked principals here). tenantId scopes the
        action to a tenant the principal is enrolled in (required). Global-administrator
        only.
      operationId: DisableGlobalApplicationPrincipal
      parameters:
      - explode: false
        in: path
        name: principalId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "204":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
