        \ its immutable received evidence — the inbox's recovery lever (distinct from\
        \ the outbox's same-row requeue). A selected replay-generation row is resolved\
        \ back to its lineage root before replaying, so numbering stays global and\
        \ collision-free; the new row is claimable at once with a fresh retry budget,\
