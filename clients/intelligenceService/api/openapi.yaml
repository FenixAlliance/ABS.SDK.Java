openapi: 3.0.4
info:
  contact:
    email: support@fenix-alliance.com
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  termsOfService: https://absuite.net/eula
  title: IntelligenceService
  version: 2.0.0.0
servers:
- description: Alliance Business Suite API
  url: "{server}"
  variables:
    server:
      default: https://absuite.net
      description: ABS instance base URL
      enum:
      - https://absuite.net
      - https://test.absuite.net
      - https://dev.absuite.net
      - https://localhost:44388
tags:
- name: AiProviders
- name: Capabilities
- name: CognitiveAgentConversationAttachments
- name: CognitiveAgentConversations
- name: CognitiveAgentMessages
- name: CognitiveAgents
- name: CognitiveAgentSkills
- name: CognitiveAgentVariables
- name: CognitiveSkills
- name: FenixAlliance.ABS.Web
- name: IntelligenceService
paths:
  /api/v2/IntelligenceService/AiProviders:
    get:
      description: "Returns every AI provider key this instance has a registered adapter\
        \ for. The set is a property of the deployment, so it is not tenant-scoped;\
        \ what varies per tenant is the credential for a provider, which is never\
        \ returned here."
      operationId: GetAiProvidersAsync
      parameters:
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AiProviderDtoListEnvelope'
          description: OK
      summary: Get the available AI providers
      tags:
      - AiProviders
      x-accepts:
      - application/json
      - application/xml
  /api/v2/IntelligenceService/Capabilities:
    get:
      description: "Retrieves the full governed-capability catalog for the specified\
        \ tenant, optionally narrowed to a single execution surface. Every capability\
        \ is returned with an Available flag (and a DeniedReason when not available)\
        \ so callers render disabled-with-reason instead of hiding; entitlement is\
        \ computed server-side."
      operationId: GetCapabilitiesAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: surface
        required: false
        schema:
          enum:
          - None
          - Workflow
          - AI
          - Mcp
          - Job
          - Integration
          - Webhook
          - Admin
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/CapabilityDtoListEnvelope'
          description: OK
      summary: Get the annotated capability catalog
      tags:
      - Capabilities
      x-accepts:
      - application/json
      - application/xml
  /api/v2/IntelligenceService/Capabilities/Count:
    get:
      description: "Returns the number of governed capabilities in the catalog for\
        \ the specified tenant — the surface-matching total that mirrors the list\
        \ route's returned-set size (entitled or not), honouring the same optional\
        \ surface narrowing."
      operationId: GetCapabilitiesCountAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: surface
        required: false
        schema:
          enum:
          - None
          - Workflow
          - AI
          - Mcp
          - Job
          - Integration
          - Webhook
          - Admin
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
          description: OK
      summary: Get the capability catalog count
      tags:
      - Capabilities
      x-accepts:
      - application/json
      - application/xml
  /api/v2/IntelligenceService/Capabilities/{key}:
    get:
      description: "Retrieves a single governed capability by its stable, dotted key,\
        \ stamped with the Available / DeniedReason entitlement flag. Returns 404\
        \ only when the capability does not exist; an existing capability the actor\
        \ is not entitled to run is returned annotated as unavailable, not hidden."
      operationId: GetCapabilityByKeyAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: key
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/CapabilityDtoEnvelope'
          description: OK
      summary: Get a capability by key
      tags:
      - Capabilities
      x-accepts:
      - application/json
      - application/xml
  /api/v2/IntelligenceService/CognitiveAgents/{agentId}/Conversations/{conversationId}/Attachments:
    post:
      description: "Uploads a file into the acting user's OWN conversation attachment\
        \ store, scanned and catalogued through the storage spine. A conversation\
        \ the caller does not own returns 404. The response carries the new file's\
        \ id, name, content type and length; the chat UI passes that id as an AttachmentFileIds\
        \ entry when it sends the referencing user turn."
      operationId: UploadCognitiveAgentConversationAttachmentAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: conversationId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                style: form
            schema:
              $ref: '#/components/schemas/UploadCognitiveAgentConversationAttachmentAsync_request'
      responses:
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationAttachmentUploadResultDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationAttachmentUploadResultDtoEnvelope'
          description: OK
      summary: Upload an attachment to a cognitive agent conversation
      tags:
      - CognitiveAgentConversationAttachments
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
      - application/xml
  /api/v2/IntelligenceService/CognitiveAgents/{agentId}/Conversations:
    get:
      description: Retrieves all managed conversations for the specified cognitive
        agent and tenant.
      operationId: GetCognitiveAgentConversationsAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CognitiveAgentConversationDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/CognitiveAgentConversationDtoCollectionQueryParameters'
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CognitiveAgentConversationDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/CognitiveAgentConversationDtoListEnvelope'
          description: OK
      summary: Get all conversations for a cognitive agent
      tags:
      - CognitiveAgentConversations
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
    post:
      description: Creates a new managed conversation for the specified cognitive
        agent and tenant.
      operationId: CreateCognitiveAgentConversationAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CognitiveAgentConversationCreateDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/CognitiveAgentConversationCreateDto'
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad Request
        "200":
          description: OK
      summary: Create a new cognitive agent conversation
      tags:
      - CognitiveAgentConversations
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
  /api/v2/IntelligenceService/CognitiveAgents/{agentId}/Conversations/Count:
    get:
      description: Returns the count of managed conversations for the specified cognitive
