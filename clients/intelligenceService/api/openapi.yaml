              schema:
                $ref: '#/components/schemas/CognitiveAgentConversationDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/CognitiveAgentConversationDtoEnvelope'
          description: OK
      summary: Get a cognitive agent conversation by ID
      tags:
      - CognitiveAgentConversations
      x-accepts:
      - application/json
      - application/xml
    put:
      description: Updates an existing managed conversation for the specified cognitive
        agent and tenant.
      operationId: UpdateCognitiveAgentConversationAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CognitiveAgentConversationUpdateDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/CognitiveAgentConversationUpdateDto'
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
