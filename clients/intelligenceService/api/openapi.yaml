  /api/v2/IntelligenceService/CognitiveAgents/{agentId}/Conversations/{conversationId}/Messages/{id}:
    get:
      description: Retrieves a specific durable message of a conversation by its identifier.
      operationId: GetCognitiveAgentMessageByIdAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: agentId
        required: true
