openapi: 3.0.4
info:
  contact:
    email: support@fenix-alliance.com
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  termsOfService: https://absuite.net/eula
  title: TrustService
  version: 2.0.0.0
servers:
- description: Alliance Business Suite API
  url: "{server}"
  variables:
    server:
      default: https://absuite.net
      description: ABS instance base URL
      enum:
      - https://absuite.net
      - https://test.absuite.net
      - https://dev.absuite.net
      - https://localhost:44388
tags:
- name: FenixAlliance.ABS.Web
- name: Signatures
- name: SignedDocumentArtifacts
- name: SignedDocumentAttachments
- name: SignedDocuments
- name: SigningCertificates
- name: SigningEngine
- name: SigningLogs
- name: SigningParticipants
- name: SigningProfileGraphicalRepresentations
- name: SigningProfiles
- name: SigningRequests
paths:
  /version:
    get:
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-accepts:
      - application/json
  /health:
    get:
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-accepts:
      - application/json
  /api/v2/AIService/Agents/{agentId}/agui:
    post:
      parameters:
      - explode: false
        in: path
        name: agentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-accepts:
      - application/json
  /hello:
    get:
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-accepts:
      - application/json
  /register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        "200":
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
          description: Bad Request
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/problem+json
  /login:
    post:
      parameters:
      - explode: true
        in: query
        name: useCookies
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: useSessionCookies
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/json
  /refresh:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/json
  /confirmEmail:
    get:
      operationId: MapIdentityApi-/confirmEmail
      parameters:
      - explode: true
        in: query
        name: userId
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: code
        required: true
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: changedEmail
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-accepts:
      - application/json
  /resendConfirmationEmail:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendConfirmationEmailRequest'
        required: true
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/json
  /forgotPassword:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        "200":
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
          description: Bad Request
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/problem+json
  /resetPassword:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        "200":
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
          description: Bad Request
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/problem+json
  /manage/2fa:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorResponse'
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
          description: Bad Request
        "404":
          description: Not Found
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /manage/info:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
          description: Bad Request
        "404":
          description: Not Found
      tags:
      - FenixAlliance.ABS.Web
      x-accepts:
      - application/json
      - application/problem+json
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
          description: Bad Request
        "404":
          description: Not Found
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/problem+json
  /Account/PerformExternalLogin:
    post:
      requestBody:
        content:
          multipart/form-data:
            encoding:
              provider:
                style: form
              returnUrl:
                style: form
            schema:
              $ref: '#/components/schemas/_Account_PerformExternalLogin_post_request'
          application/x-www-form-urlencoded:
            encoding:
              provider:
                style: form
              returnUrl:
                style: form
            schema:
              $ref: '#/components/schemas/_Account_PerformExternalLogin_post_request'
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /Account/Logout:
    post:
      requestBody:
        content:
          multipart/form-data:
            encoding:
              returnUrl:
                style: form
            schema:
              $ref: '#/components/schemas/_Account_Logout_post_request'
          application/x-www-form-urlencoded:
            encoding:
              returnUrl:
                style: form
            schema:
              $ref: '#/components/schemas/_Account_Logout_post_request'
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /Account/Manage/LinkExternalLogin:
    post:
      requestBody:
        content:
          multipart/form-data:
            encoding:
              provider:
                style: form
            schema:
              $ref: '#/components/schemas/_Account_Manage_LinkExternalLogin_post_request'
          application/x-www-form-urlencoded:
            encoding:
              provider:
                style: form
            schema:
              $ref: '#/components/schemas/_Account_Manage_LinkExternalLogin_post_request'
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /Account/Manage/DownloadPersonalData:
    post:
      responses:
        "200":
          description: OK
      tags:
      - FenixAlliance.ABS.Web
      x-accepts:
      - application/json
  /api/v2/TrustService/Signatures:
    get:
      description: Retrieves all signatures for the specified tenant.
      operationId: GetSignaturesAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/SignatureDtoListEnvelope'
          description: OK
      summary: Get all signatures
      tags:
      - Signatures
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/Signatures/Count:
    get:
      description: Returns the count of signatures for the specified tenant.
      operationId: GetSignaturesCountAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
          description: OK
      summary: Get signatures count
      tags:
      - Signatures
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/Signatures/{id}:
    get:
      description: Retrieves a specific signature by its identifier.
      operationId: GetSignatureByIdAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureDto'
            application/xml:
              schema:
                $ref: '#/components/schemas/SignatureDto'
          description: OK
      summary: Get signature by ID
      tags:
      - Signatures
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/SignedDocumentArtifacts/{signedDocumentId}/primary-file/{fileUploadId}:
    put:
      description: Links an existing scan-gated FileUpload as the document's mutable
        authoring artifact (only while editable).
      operationId: SetPrimaryAuthoringFileAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: signedDocumentId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: fileUploadId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "200":
          description: OK
      summary: Set the primary authoring file
      tags:
      - SignedDocumentArtifacts
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/SignedDocumentArtifacts/{signedDocumentId}/freeze:
    post:
      description: "Copies the primary authoring artifact into a new Sealed frozen-source\
        \ artifact, hashes it, and binds it to the document (LockState = FrozenForSignature)."
      operationId: FreezeAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: signedDocumentId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustArtifactReferenceDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/TrustArtifactReferenceDtoEnvelope'
          description: OK
      summary: Freeze the source for signature
      tags:
      - SignedDocumentArtifacts
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/SignedDocumentArtifacts/reference/{fileUploadId}:
    get:
      description: Resolves a stored artifact's reference (FileUpload id + key + hash
        + media hints).
      operationId: GetReferenceAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: fileUploadId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustArtifactReferenceDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/TrustArtifactReferenceDtoEnvelope'
          description: OK
      summary: Get an artifact reference
      tags:
      - SignedDocumentArtifacts
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/SignedDocumentArtifacts/reference/{fileUploadId}/verify:
    get:
      description: Re-reads the artifact bytes and verifies them against the recorded
        SHA-256. Returns true on match.
      operationId: VerifyAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: false
        in: path
        name: fileUploadId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/BooleanEnvelope'
          description: OK
      summary: Verify an artifact hash
      tags:
      - SignedDocumentArtifacts
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/SignedDocumentAttachments:
    get:
      description: Retrieves all signed document attachments for the specified tenant.
      operationId: GetSignedDocumentAttachmentsAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignedDocumentAttachmentDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/SignedDocumentAttachmentDtoListEnvelope'
          description: OK
      summary: Get all signed document attachments
      tags:
      - SignedDocumentAttachments
      x-accepts:
      - application/json
      - application/xml
    post:
      description: Links an already-stored file to a SignedDocument (metadata + Storage
        pointer; no bytes).
      operationId: CreateSignedDocumentAttachmentAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedDocumentAttachmentCreateDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/SignedDocumentAttachmentCreateDto'
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad Request
        "200":
          description: OK
      summary: Create a new signed document attachment
      tags:
      - SignedDocumentAttachments
      x-content-type: application/json
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/SignedDocumentAttachments/Count:
    get:
      description: Returns the count of signed document attachments for the specified
        tenant.
      operationId: GetSignedDocumentAttachmentsCountAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: api-version
        required: false
        schema:
          type: string
        style: form
      - explode: false
        in: header
        name: x-api-version
        required: false
        schema:
          type: string
        style: simple
      responses:
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
          description: OK
      summary: Get signed document attachments count
      tags:
      - SignedDocumentAttachments
      x-accepts:
      - application/json
      - application/xml
  /api/v2/TrustService/SignedDocumentAttachments/{id}:
    delete:
      description: Deletes a signed document attachment link for the specified tenant.
      operationId: DeleteSignedDocumentAttachmentAsync
      parameters:
      - explode: true
        in: query
        name: tenantId
        required: true
        schema:
          format: uuid
